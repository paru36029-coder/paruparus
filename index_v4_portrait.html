<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぽちっと！新宮ナビ</title>
    <!-- 丸ゴシック体の読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style_v4_portrait.css">
    <script>
        // 1階以外なら横画面へ自動転送
        const savedFloor = localStorage.getItem('naviCurrentFloor');
        if (savedFloor && savedFloor !== '1' && !window.location.search.includes('force=tate')) {
            window.location.href = 'index_v4.html';
        }
    </script>
</head>

<body tabindex="-1">
    <!-- 管理画面モーダル（独立した管理者設定Webアプリ admin-control.html へ移行し、撤廃しました） -->

    <div class="top-bar">
        <div id="current-time">00:00:00</div>
        <div id="global-countdown-container">
            <span id="global-countdown-text">読み込み中...</span>
        </div>
        <button class="admin-open-trigger" onclick="document.getElementById('admin-modal').style.display='flex'">⚙️</button>
    </div>

    <div id="home-view"
        style="display: flex; flex-direction: column; width: 100%; height: calc(100vh - var(--top-bar-height)); margin-top: var(--top-bar-height);">

        <div class="main-content-split">
            <!-- 左パネル：カウントダウン＋アプリ -->
            <div class="left-panel">
                <!-- ★ カウントダウンウィジェット -->
                <div id="countdown-widget" class="countdown-widget glass-panel">
                    <div class="cw-label" id="next-class-name">次のチャイムまで</div>
                    <div class="cw-timer" id="countdown-timer">--:--</div>
                </div>
                <!-- ★ 遅延情報ウィジェット -->
                <div id="delay-widget" class="delay-widget glass-panel" style="display: none;">
                    <div class="delay-label">⚠️ スケジュール遅延情報</div>
                    <div class="delay-text" id="delay-text-display">遅延情報はありません</div>
                </div>
                <div class="apps-area glass-panel" style="flex:1;">
                    <div class="panel-label">📱 アプリメニュー</div>
                    <div class="apps-row-vertical" id="dynamic-apps-container">
                        <!-- script.jsによって動的に生成されます -->
                    </div>
                </div>
            </div>
            <!-- 右パネル：メインコンテンツ（時刻表等） -->
            <div class="right-panel" style="position:relative;" tabindex="-1">
                <div class="info-card-full" style="height:100%;" tabindex="-1">
                    <iframe id="main-panel-iframe" src="wait-time-right.html" tabindex="-1"
                        style="width: 100%; height: 100%; border: none; border-radius: 25px;"></iframe>
                    <!-- 🛡️ 透明なガードパネル：タッチ・スクロール有効化のため撤廃しました -->
                </div>
            </div>
        </div>
    </div>

    <!-- ★ 残り5分警告パネル（ホーム画面右下に大きく表示） -->
    <div id="countdown-alert-panel" class="countdown-alert-panel">
        <div class="alert-pulse-ring"></div>
        <div class="alert-inner">
            <div class="alert-icon">⏰</div>
            <div class="alert-label">まもなく始まります</div>
            <div class="alert-event" id="alert-event-name">---</div>
            <div class="alert-time" id="alert-countdown-time">0分00秒</div>
        </div>
    </div>

    <!-- ★ 画面占有ロックスクリーン -->
    <div id="countdown-lock-screen" class="countdown-lock-screen">
        <div class="lock-bg-rings">
            <div class="lock-ring r1"></div>
            <div class="lock-ring r2"></div>
            <div class="lock-ring r3"></div>
        </div>
        <div class="lock-content">
            <div class="lock-icon">🔔</div>
            <div class="lock-label">次のチャイムまで</div>
            <div class="lock-event" id="lock-event-name">---</div>
            <div class="lock-time" id="lock-countdown-time">00:00</div>
            <div class="lock-footer">管理者が画面をロックしています</div>
        </div>
    </div>

    <!-- 全画面アプリ表示用 -->
    <div id="app-fullscreen-view"
        style="display: none; width: 100%; height: calc(100vh - var(--top-bar-height)); z-index: 1000; position: absolute; top: var(--top-bar-height); left: 0; flex-direction: column; background: #f0f9f1;">
        <div
            style="background: rgba(255,255,255,0.8); backdrop-filter: blur(15px); padding: 18px 45px; display: flex; justify-content: flex-start; align-items: center; gap: 20px; border-bottom: 3px solid #16a34a; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
            <button onclick="closeApp()"
                style="padding: 10px 30px; font-size: 1.3rem; border-radius: 12px; cursor: pointer; background: #ffffff; border: 2px solid #16a34a; font-weight: 900; color: #16a34a; box-shadow: 0 4px 10px rgba(22,163,74,0.15); transition: 0.2s;">
                ◀ ホームに戻る (Tab)</button>
            <h1 id="app-title"
                style="margin: 0; font-size: 2.2rem; color: #064e3b; font-weight: 900; letter-spacing: 2px;">アプリ名</h1>
        </div>
        <iframe id="app-iframe" src=""
            style="width: 100%; flex-grow: 1; border: none; background: transparent;"></iframe>
    </div>

    <!-- ポップアップアプリ表示用 -->
    <div id="popup-window" class="popup-window" style="display: none;">
        <div id="popup-header" class="popup-header">
            <button class="popup-close-btn" onclick="closePopupApp()">✕ 閉じる</button>
            <span id="popup-title" style="font-weight:bold; color:#064e3b; font-size: 1.2rem;">アプリ名</span>
        </div>
        <div class="popup-content">
            <iframe id="popup-iframe" src="" frameborder="0"></iframe>
            <div id="popup-overlay" class="popup-overlay"
                style="display: none; position:absolute; top:0; left:0; width:100%; height:100%;"></div>
        </div>
    </div>

    <!-- 🚨 1分切り時の画面端赤フラッシュ -->
    <div id="urgent-border-flash"></div>

    <script src="script_v4.js?v=8"></script>
</body>

</html>
