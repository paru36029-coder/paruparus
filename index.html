<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぽちっと！新宮ナビ ～新緑祭特別ver～</title>
    <!-- 丸ゴシック体の読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body style="margin: 0; overflow: hidden; font-family: sans-serif;">

    <!-- 派手な画面切り替え用オーバーレイ -->
    <div id="transition-overlay" class="transition-overlay">
        <div class="transition-circle"></div>
    </div>

    <div id="admin-modal" class="admin-modal"
        style="display: none; position: absolute; z-index: 100; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
        <div class="admin-content" style="background: white; padding: 40px; border-radius: 20px; width: 600px;">
            <h2>⚙️ システム管理者設定</h2>

            <div class="setting-item" style="margin-bottom: 20px;">
                <label>🖼️ 左側パネル（表示するファイル名）：</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="admin-left-panel-input" value="wait-time.html"
                        style="font-size: 1.2rem; padding: 5px; flex-grow: 1;" placeholder="例: ファイル名.html">
                    <button class="admin-btn" onclick="changeLeftPanel()"
                        style="background: #3498db; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">更新する</button>
                </div>
            </div>

            <div class="setting-item" style="margin-bottom: 20px;">
                <label>🖼️ 右側パネル（表示するファイル名）：</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="admin-right-panel-input" value="google-meet.html"
                        style="font-size: 1.2rem; padding: 5px; flex-grow: 1;" placeholder="例: ファイル名.html">
                    <button class="admin-btn" onclick="changeRightPanel()"
                        style="background: #3498db; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">更新する</button>
                </div>
            </div>

            <div class="setting-item" style="margin-top: 40px; display: block;">
                <label>📱 アプリボタンの追加：</label><br>
                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
                    <input type="text" id="new-app-name" placeholder="アプリ名 (例: マップ)"
                        style="padding: 8px; flex: 1; font-size: 1rem;">
                    <input type="text" id="new-app-icon" placeholder="アイコン (例: 🗺️)"
                        style="padding: 8px; width: 140px; font-size: 1rem;">
                    <input type="text" id="new-app-url" placeholder="ファイル名 (例: マップ.html)"
                        style="padding: 8px; flex: 2; font-size: 1rem;">
                    <input type="text" id="new-app-key" placeholder="起動キー (例: 1)"
                        style="padding: 8px; width: 120px; font-size: 1rem;">
                    <select id="new-app-mode"
                        style="padding: 8px; font-size: 1rem; border-radius: 4px; border: 1px solid #ccc;">
                        <option value="fullscreen">全画面</option>
                        <option value="popup">ポップアップ</option>
                    </select>
                    <button class="admin-btn" onclick="addApp()"
                        style="background: #2ecc71; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer;">追加</button>
                </div>
                <div id="admin-app-list"
                    style="margin-top: 20px; max-height: 200px; overflow-y: auto; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 1.1rem;">
                    <!-- 追加済みアプリ一覧がここに表示されます -->
                </div>
            </div>

            <div class="setting-item" style="margin-top: 40px;">
                <label>💻 システム電源：</label><br>
                <button class="admin-btn danger" onclick="exitApp()"
                    style="background: #E74C3C; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">サイネージを終了する</button>
            </div>

            <hr style="margin: 30px 0; border: 1px solid #e2e8f0;">
            <div style="text-align: right;">
                <button class="admin-btn" onclick="closeAdmin()"
                    style="padding: 10px 20px; font-size: 1.2rem; cursor: pointer;">設定を閉じる</button>
            </div>
        </div>
    </div>


    <div id="home-view" style="display: flex; flex-direction: column; width: 100%; height: 100vh;">
        <!-- キャラクター画像（丸形に切り取って配置。CSSで画像をズーム＆トリミング） -->
        <div class="mascot-badge" id="shingu-badge"></div>
        <div class="mascot-badge" id="matsumiya-badge"></div>

        <div style="display: flex; flex-direction: column; width: 100%; flex-grow: 1;">
            <!-- 上部：ヘッダー・カウントダウン・アプリボタン -->
            <div class="top-bar">
                <div class="top-bar-left">
                    <div class="header">
                        <h1>ぽっちと！新宮ナビ</h1>
                        <div id="current-time">00:00:00</div>
                    </div>

                    <div class="countdown-box">
                        <h2 id="next-class-name">次のチャイムまで</h2>
                        <div id="countdown-timer">--分 --秒</div>
                    </div>
                </div>

                <div class="apps-row" id="dynamic-apps-container">
                    <!-- アプリボタンは JavaScript によってここに動的に追加されます -->
                </div>
            </div>

            <!-- メイン領域：左右2画面分割 -->
            <div class="main-content"
                style="flex-grow: 1; padding: 20px; box-sizing: border-box; display: flex; flex-direction: row; gap: 20px; position: relative;">
                <!-- 左画面 -->
                <div class="info-card"
                    style="flex: 1; display: flex; flex-direction: column; height: 100%; padding: 20px; box-sizing: border-box;">
                    <h2 id="left-panel-title" style="color: #27ae60; margin-top: 0; margin-bottom: 15px;">🌟 待ち時間情報</h2>
                    <iframe id="left-panel-iframe" src="wait-time.html"
                        style="width: 100%; height: 100%; border: none; flex-grow: 1; border-radius: 15px;"></iframe>
                </div>
                <!-- 右画面 -->
                <div class="info-card"
                    style="flex: 1; display: flex; flex-direction: column; height: 100%; padding: 20px; box-sizing: border-box;">
                    <h2 id="right-panel-title" style="color: #27ae60; margin-top: 0; margin-bottom: 15px;">🌟 会場中継カメラ
                    </h2>
                    <iframe id="right-panel-iframe" src="google-meet.html"
                        style="width: 100%; height: 100%; border: none; flex-grow: 1; border-radius: 15px;"></iframe>
                </div>
            </div>
        </div>

    </div>
    <div id="app-fullscreen-view"
        style="display: none; width: 100%; height: 100vh; background-color: #f0f4f8; flex-direction: column; z-index: 50; position: absolute; top: 0; left: 0;">

        <div
            style="background-color: #2c3e50; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h1 id="app-title" style="margin: 0; font-size: 2.5rem;">アプリ名</h1>
            <button onclick="closeApp()"
                style="padding: 15px 30px; font-size: 1.5rem; border-radius: 10px; cursor: pointer; border: none; font-weight: bold; background-color: #e2e8f0; color: #2c3e50; transition: 0.2s;">
                ◀ ホームに戻る (Esc)
            </button>
        </div>

        <iframe id="app-iframe" src=""
            style="width: 100%; flex-grow: 1; border: none; background-color: #ffffff;"></iframe>
    </div>

    <!-- 自由に動かし、リサイズできるポップアップウィンドウ -->
    <div id="popup-window" class="popup-window" style="display: none;">
        <div id="popup-header" class="popup-header">
            <span id="popup-title">アプリ名</span>
            <button class="popup-close-btn" onclick="closePopupApp()">✕</button>
        </div>
        <div class="popup-content">
            <iframe id="popup-iframe" src="" frameborder="0"></iframe>
            <!-- ドラッグ・リサイズ時に iframe が邪魔をしないようにするためのオーバーレイ -->
            <div id="popup-overlay" class="popup-overlay" style="display: none;"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
