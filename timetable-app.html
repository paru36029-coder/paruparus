<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>新緑祭 タイムテーブル</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
            background: linear-gradient(135deg, #0f766e 0%, #064e3b 100%);
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        /* 背景装飾 */
        .bg-shapes {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            filter: blur(60px);
        }
        .shape1 { width: 500px; height: 500px; top: -150px; left: -100px; background: rgba(52, 211, 153, 0.2); }
        .shape2 { width: 400px; height: 400px; bottom: -100px; right: -50px; background: rgba(16, 185, 129, 0.15); }

        /* ===== ヘッダー ===== */
        .page-header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #live-clock {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: rgba(0,0,0,0.25);
            padding: 6px 20px;
            border-radius: 30px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            font-variant-numeric: tabular-nums;
        }

        /* ===== メインエリア ===== */
        .main-area {
            position: relative;
            z-index: 10;
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.3) transparent;
        }
        .main-area::-webkit-scrollbar { width: 8px; }
        .main-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
        .main-area::-webkit-scrollbar-track { background: transparent; }

        /* ===== タイムテーブル ===== */
        .timetable-wrap {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 1400px;
            margin: 0 auto;
            padding-bottom: 20px;
        }

        .event-card {
            display: flex;
            align-items: stretch;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: fadeSlideIn 0.5s ease forwards;
            color: #1f2937;
            opacity: 0;
            min-height: 80px;
        }
        .event-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 1);
        }

        .event-card.is-now {
            border: 2px solid #f59e0b;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4), 0 8px 32px rgba(0, 0, 0, 0.15);
            transform: scale(1.02);
            background: #ffffff;
            z-index: 2;
            position: relative;
        }
        .event-card.is-now:hover {
            transform: translateY(-4px) scale(1.03);
        }

        .event-card.is-past {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            filter: grayscale(100%);
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .event-time-col {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            min-width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            flex-shrink: 0;
            border-right: 1px solid rgba(255,255,255,0.2);
        }
        .event-card.is-now .event-time-col {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        .event-card.is-past .event-time-col {
            background: linear-gradient(135deg, #6b7280, #4b5563);
        }

        .event-start { font-size: 1.4rem; font-weight: 900; line-height: 1.1; letter-spacing: 0px; }
        .event-end   { font-size: 0.85rem; font-weight: 700; opacity: 0.9; margin-top: 2px; }

        .event-body {
            flex: 1;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }
        .event-name {
            font-size: 1.15rem;
            font-weight: 900;
            color: #064e3b;
        }
        .event-card.is-past .event-name { color: #4b5563; }

        .event-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .event-badge {
            font-size: 0.85rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            background: #d1fae5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }

        .countdown-text {
            font-size: 0.95rem;
            font-weight: 800;
            background: rgba(0,0,0,0.03);
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 8px;
            width: fit-content;
        }

        .now-badge {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding-right: 16px;
        }
        .now-label {
            background: linear-gradient(135deg, #fde047, #f59e0b);
            color: #78350f;
            font-size: 0.85rem;
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow {
            from { box-shadow: 0 0 5px rgba(245, 158, 11, 0.4); transform: scale(1); }
            to   { box-shadow: 0 0 20px rgba(245, 158, 11, 0.8); transform: scale(1.05); }
        }

        /* 📱 スマホ向けレスポンシブ */
        @media screen and (max-width: 768px) {
            .timetable-wrap {
                grid-template-columns: 1fr;
            }
            .page-header {
                flex-direction: column;
                gap: 8px;
                padding: 50px 10px 10px 10px;
            }
            .page-header h1 {
                font-size: 1.3rem;
            }
            #live-clock {
                font-size: 1.4rem;
                padding: 4px 15px;
            }
            .event-time-col {
                min-width: 80px;
                padding: 10px 5px;
            }
            .event-start {
                font-size: 1.2rem;
            }
            .main-area {
                padding: 15px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
    </div>

    <div class="page-header">
        <h1>📅 新緑祭 タイムテーブル</h1>
        <div id="live-clock">--:--:--</div>
    </div>

    <div class="main-area" id="main-area">
        <div class="timetable-wrap" id="timetable-wrap">
            <!-- JSで生成されます -->
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'shinryokusai_timetable_v2';
        const events = [
            { id: 1, start: '10:15', end: '10:35', name: '1年生企画(中継)', type: '' },
            { id: 2, start: '10:45', end: '11:10', name: '吹奏楽部', type: '' },
            { id: 3, start: '11:18', end: '11:23', name: '6.0', type: '有志' },
            { id: 4, start: '11:25', end: '11:29', name: 'Homies', type: '有志' },
            { id: 5, start: '11:32', end: '11:38', name: 'you U', type: '有志' },
            { id: 6, start: '11:40', end: '11:50', name: 'ピアニッシモ', type: '有志' },
            { id: 7, start: '11:52', end: '11:59', name: 'はるな', type: '有志' },
            { id: 8, start: '12:15', end: '12:25', name: 'ムラサキしきぶ', type: '有志' },
            { id: 9, start: '12:35', end: '12:44', name: 'TA・WA・SHI', type: '有志' },
            { id: 10, start: '13:05', end: '13:35', name: 'ダンス部', type: '' },
            { id: 11, start: '13:40', end: '13:50', name: '書道部', type: '' }
        ];

        function init() {
            renderTimetable();
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(renderTimetable, 60000);
        }

        function renderTimetable() {
            const wrap = document.getElementById('timetable-wrap');
            const nowStr = getCurrentTimeStr();

            wrap.innerHTML = events.map((ev, index) => {
                const isPast = ev.end ? ev.end <= nowStr : ev.start < nowStr;
                let isNow = false;
                if (!isPast) {
                    if (ev.end) {
                        isNow = ev.start <= nowStr && nowStr < ev.end;
                    } else {
                        isNow = ev.start <= nowStr;
                    }
                }

                const typeClass = isPast ? 'is-past' : (isNow ? 'is-now' : '');
                const delay = index * 0.05;

                return `
                <div class="event-card ${typeClass}" style="animation-delay: ${delay}s">
                    <div class="event-time-col">
                        <div class="event-start">${ev.start}</div>
                        ${ev.end ? `<div class="event-end">〜${ev.end}</div>` : ''}
                    </div>
                    <div class="event-body">
                        <div class="event-name">${escHtml(ev.name)}</div>
                        ${ev.type ? `<div class="event-meta"><span class="event-badge">${escHtml(ev.type)}</span></div>` : ''}
                        <div class="countdown-text" id="cd-${ev.id}"></div>
                    </div>
                    ${isNow ? '<div class="now-badge"><span class="now-label">▶ 開催中</span></div>' : ''}
                </div>`;
            }).join('');
        }

        function getCurrentTimeStr() {
            const now = new Date();
            return String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            const s = String(now.getSeconds()).padStart(2,'0');
            document.getElementById('live-clock').textContent = `${h}:${m}:${s}`;

            events.forEach(ev => {
                const cdEl = document.getElementById(`cd-${ev.id}`);
                
                const nowMs = now.getTime();
                const startParts = ev.start.split(':');
                const startD = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(startParts[0]), parseInt(startParts[1]), 0);
                
                let endD = null;
                if (ev.end) {
                    const endParts = ev.end.split(':');
                    endD = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(endParts[0]), parseInt(endParts[1]), 0);
                }

                if (nowMs < startD.getTime()) {
                    if (cdEl) {
                        const diff = Math.floor((startD.getTime() - nowMs) / 1000);
                        const dh = Math.floor(diff / 3600);
                        const dm = Math.floor((diff % 3600) / 60);
                        const ds = diff % 60;
                        let text = '開始まで ';
                        if (dh > 0) text += `${dh}時間`;
                        text += `${dm}分${String(ds).padStart(2,'0')}秒`;
                        cdEl.innerHTML = `<span style="color:#059669;">⏳ ${text}</span>`;
                    }
                } else if (endD && nowMs < endD.getTime()) {
                    if (cdEl) {
                        const diff = Math.floor((endD.getTime() - nowMs) / 1000);
                        const dm = Math.floor(diff / 60);
                        const ds = diff % 60;
                        cdEl.innerHTML = `<span style="color:#d97706;">🔥 終了まで ${dm}分${String(ds).padStart(2,'0')}秒</span>`;
                    }
                } else {
                    if (cdEl) {
                        cdEl.innerHTML = `<span style="color:#6b7280;">✅ 終了しました</span>`;
                    }
                }
            });
        }

        function escHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
        }

        init();
    </script>
    <script src="app_home_btn.js"></script>
</body>
</html>
