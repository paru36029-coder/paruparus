<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>待ち時間情報</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* 新緑祭のステッカー風・ポップデザイン */
        body { 
            font-family: 'M PLUS Rounded 1c', "Hiragino Maru Gothic ProN", "Meiryo", sans-serif; 
            background-color: transparent; 
            margin: 0; 
            padding: 10px; 
            overflow-x: hidden;
            scrollbar-width: thin;
        }
        /* クラスごとのカードデザイン（コンパクト化＆ステッカー風） */
        .card { 
            background: #ffffff; 
            border-radius: 15px; 
            padding: 12px; 
            margin-bottom: 12px; 
            border: 4px solid #1a3a28;
            box-shadow: 4px 4px 0px #1a3a28; 
            transition: all 0.3s ease;
        }
        .class-name { 
            font-size: 0.9rem; color: #1a3a28; font-weight: 900; 
            background: #a2d9b5; display: inline-block; 
            padding: 2px 8px; border-radius: 8px; border: 2px solid #1a3a28; 
        }
        .title { 
            font-size: 1.3rem; color: #27ae60; margin: 6px 0 8px 0; font-weight: 900; 
        }
        
        /* 情報が並ぶエリア */
        .info-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .info-box { 
            background: #e0f8e9; 
            padding: 8px; 
            border-radius: 10px; 
            flex: 1; 
            min-width: 80px;
            text-align: center; 
            border: 2px solid #1a3a28;
            box-shadow: 2px 2px 0px #1a3a28;
        }
        .info-label { font-size: 0.7rem; color: #1a3a28; font-weight: 900; display: block; margin-bottom: 2px;}
        .info-value { font-size: 1.4rem; font-weight: 900; color: #1a3a28; }
        
        /* 整理券呼び出しを目立たせる */
        .call-box { 
            background: #fcf6bd; 
            transform-origin: center;
            animation: pulse 1.5s infinite alternate; 
        }
        .call-value { color: #e74c3c; font-size: 1.5rem;}
        .likes-value { color: #3498db; }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 2px 2px 0px #1a3a28; }
            100% { transform: scale(1.03); box-shadow: 4px 4px 0px #1a3a28; }
        }
    </style>
</head>
<body>

    <div id="container">
        <h2 style="text-align: center; color: #1a3a28; font-weight:900;">🔄 最新データを読み込み中...</h2>
    </div>

    <script>
        // 取得済みのGASのURL
        const API_URL = 'https://script.google.com/macros/s/AKfycbywa0HJYihIP-G_Pax5CLbl1W1fK5cGznyBek2n02p0RWOyCy4QnRevvlfP7P8ta2fJOA/exec';

        // データを取得して画面を作る関数
        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                let html = "";
                
                // スプレッドシートの1行ごとにカードを作る
                data.forEach(item => {
                    html += `
                    <div class="card">
                        <div class="class-name">🏫 ${item.className}</div>
                        <div class="title">${item.title || "企画名 準備中"}</div>
                        <div class="info-row">
                            <div class="info-box">
                                <span class="info-label">⏱️ 待ち時間</span>
                                <span class="info-value">${item.waitTime || "0"} 分</span>
                            </div>
                            
                            ${(item.callNumber && String(item.callNumber).trim() !== "") ? `
                            <div class="info-box call-box">
                                <span class="info-label">📢 ただいまのお呼び出し</span>
                                <span class="info-value call-value">${item.callNumber} 番</span>
                            </div>` : ""}
                            
                            <div class="info-box">
                                <span class="info-label">👍 いいね！</span>
                                <span class="info-value likes-value">${item.likes || "0"}</span>
                            </div>
                        </div>
                    </div>`;
                });
                
                document.getElementById("container").innerHTML = html;
            } catch (error) {
                console.error("データ取得エラー:", error);
                document.getElementById("container").innerHTML = "<h2 style='color:red;'>⚠️ データの読み込みに失敗しました。電波状況を確認してください。</h2>";
            }
        }

        // 起動時にまず1回読み込む
        loadData();

        // その後、15秒ごとに自動で最新データに更新する
        setInterval(loadData, 15000);

        // ===== 自動スクロール機能（左側パネル表示でも中身を見れるように） =====
        let scrollSpeed = 0.4;
        let isPaused = false;
        
        // 触っている間は一時停止
        document.body.addEventListener('mouseenter', () => isPaused = true);
        document.body.addEventListener('mouseleave', () => isPaused = false);
        document.body.addEventListener('touchstart', () => isPaused = true);
        document.body.addEventListener('touchend', () => { setTimeout(() => isPaused=false, 2000); });
        
        function autoScroll() {
            if(!isPaused && document.body.scrollHeight > window.innerHeight) {
                window.scrollBy(0, scrollSpeed);
                // 一番下まで行ったら少し待って一番上に戻る
                if (Math.ceil(window.innerHeight + window.scrollY) >= document.body.scrollHeight) {
                    isPaused = true;
                    setTimeout(() => {
                        window.scrollTo({top: 0, behavior: 'smooth'});
                        setTimeout(() => isPaused = false, 1500);
                    }, 2000);
                }
            }
            requestAnimationFrame(autoScroll);
        }

        // 初回ロード完了後に少し待ってからスクロール開始
        setTimeout(() => { requestAnimationFrame(autoScroll); }, 4000);

    </script>

</body>
</html>
