<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新緑祭 タイムテーブル</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
            background: transparent;
            color: #2d4a3e;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== ヘッダー ===== */
        .page-header {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(39,174,96,0.3);
        }
        .page-header h1 {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
        }
        #live-clock {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.2);
            padding: 4px 14px;
            border-radius: 20px;
        }

        /* ===== メインエリア ===== */
        .main-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px 10px;
            scrollbar-width: thin;
            scrollbar-color: #a8dfc4 transparent;
        }
        .main-area::-webkit-scrollbar { width: 6px; }
        .main-area::-webkit-scrollbar-thumb { background: #a8dfc4; border-radius: 3px; }

        /* ===== タイムテーブル ===== */
        .timetable-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .event-card {
            display: flex;
            align-items: stretch;
            background: rgba(255,255,255,0.9);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(45,90,63,0.08);
            border: 2px solid rgba(255,255,255,0.8);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeSlideIn 0.3s ease;
        }
        .event-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(45,90,63,0.13); }
        .event-card.is-now {
            border-color: #f1c40f;
            box-shadow: 0 0 0 3px #f1c40f55, 0 6px 20px rgba(241,196,15,0.2);
        }
        .event-card.is-past { opacity: 0.5; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .event-time-col {
            background: linear-gradient(180deg, #27ae60, #1e8449);
            color: white;
            min-width: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 10px;
            flex-shrink: 0;
        }
        .event-card.is-now .event-time-col { background: linear-gradient(180deg, #f39c12, #d68910); }
        .event-start { font-size: 1.3rem; font-weight: 900; line-height: 1; }
        .event-end   { font-size: 0.8rem; font-weight: 400; opacity: 0.8; margin-top: 2px; }

        .event-body {
            flex: 1;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }
        .event-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1a3a28;
        }
        .event-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .event-badge {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            background: #e8f8f0;
            color: #27ae60;
        }
        .event-badge.place { background: #eaf3fe; color: #2980b9; }
        .event-note { font-size: 0.85rem; color: #777; margin-top: 2px; }

        .now-badge {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding-right: 14px;
        }
        .now-label {
            background: #f1c40f;
            color: #333;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===== 空状態 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
        }
        .empty-state .empty-icon { font-size: 4rem; margin-bottom: 12px; }
        .empty-state p { font-size: 1rem; line-height: 1.8; }

        /* ===== 管理者モーダル ===== */
        .admin-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(6px);
        }
        .admin-overlay.open { display: flex; }

        .admin-modal {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 720px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin: auto;
        }
        .admin-modal h2 {
            font-size: 1.4rem;
            color: #27ae60;
            border-bottom: 3px solid #27ae60;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 700; color: #555; margin-bottom: 4px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }

        input[type="text"], input[type="time"], select, textarea {
            width: 100%;
            padding: 9px 12px;
            border: 2px solid #dde;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #27ae60;
        }

        .btn-add {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(39,174,96,0.4); }

        .admin-list { margin-top: 20px; }
        .admin-list h3 { font-size: 1rem; color: #777; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 6px; }

        .admin-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #f8faf8;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .admin-item-info { flex: 1; }
        .admin-item-time { font-weight: 700; color: #27ae60; margin-right: 8px; }
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            flex-shrink: 0;
            margin-left: 8px;
            font-family: inherit;
        }
        .btn-delete:hover { background: #c0392b; }

        .btn-close {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            margin-top: 16px;
        }

        .data-btns {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .btn-export { background: #16a085; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-family: inherit; }
        .btn-import-label { background: #8e44ad; color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .btn-reset  { background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-family: inherit; }

        /* カラー選択 */
        .color-options { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
        .color-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.15s; }
        .color-opt:hover { transform: scale(1.2); }
        .color-opt.selected { border-color: #333; transform: scale(1.2); }

        /* ===== 管理ボタン（右下固定） ===== */
        .fab-admin {
            position: fixed;
            bottom: 18px;
            right: 18px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            font-size: 1.4rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(39,174,96,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .fab-admin:hover {
            transform: scale(1.12) rotate(20deg);
            box-shadow: 0 8px 24px rgba(39,174,96,0.5);
        }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>📅 新緑祭 タイムテーブル</h1>
        <div id="live-clock">--:--:--</div>
    </div>

    <div class="main-area">
        <div class="timetable-wrap" id="timetable-wrap">
            <!-- イベントカードがJSで生成されます -->
        </div>
    </div>

    <!-- 右下の管理ボタン -->
    <button class="fab-admin" onclick="openAdmin()" title="管理者モード（Shift+Ctrl）">⚙️</button>

    <!-- ===== 管理者モーダル ===== -->
    <div class="admin-overlay" id="admin-overlay">
        <div class="admin-modal">
            <h2>⚙️ タイムテーブル管理</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>🕐 開始時刻</label>
                    <input type="time" id="in-start">
                </div>
                <div class="form-group">
                    <label>🕑 終了時刻（任意）</label>
                    <input type="time" id="in-end">
                </div>
            </div>
            <div class="form-group">
                <label>📝 イベント名</label>
                <input type="text" id="in-name" placeholder="例：開会式、一般公開開始、ステージ企画①">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>📍 場所（任意）</label>
                    <input type="text" id="in-place" placeholder="例：体育館、第3棟1階">
                </div>
                <div class="form-group">
                    <label>🏷️ 種別（任意）</label>
                    <input type="text" id="in-type" placeholder="例：ステージ、模擬店">
                </div>
            </div>
            <div class="form-group">
                <label>📄 メモ（任意）</label>
                <input type="text" id="in-note" placeholder="例：雨天中止の場合あり">
            </div>

            <button class="btn-add" onclick="addEvent()">＋ 追加する</button>

            <div class="admin-list">
                <h3>📋 現在の登録内容</h3>
                <div id="admin-event-list"><!-- JSで生成 --></div>
            </div>

            <div class="data-btns">
                <button class="btn-export" onclick="exportData()">💾 エクスポート</button>
                <label class="btn-import-label">
                    📂 インポート
                    <input type="file" accept=".json" style="display:none" onchange="importData(event)">
                </label>
                <button class="btn-reset" onclick="resetAll()">🗑️ 全削除</button>
            </div>

            <br>
            <button class="btn-close" onclick="closeAdmin()">✕ 閉じる</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'shinryokusai_timetable_v1';
        let events = [];

        // ===== 初期化 =====
        function init() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { events = JSON.parse(saved); } catch(e) { events = []; }
            }
            renderTimetable();
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(renderTimetable, 60000); // 1分ごとに現在時刻判定を更新
        }

        // ===== 時計 =====
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            const s = String(now.getSeconds()).padStart(2,'0');
            document.getElementById('live-clock').textContent = `${h}:${m}:${s}`;
        }

        // ===== タイムテーブル描画 =====
        function renderTimetable() {
            const wrap = document.getElementById('timetable-wrap');
            if (events.length === 0) {
                wrap.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>まだ予定が登録されていません。<br>右下の <b>⚙️ ボタン</b> または <b>Shift+Ctrl</b> で<br>管理者モードを開いて予定を追加してください。</p>
                    </div>`;
                return;
            }

            // 時刻順にソート
            const sorted = [...events].sort((a, b) => a.start.localeCompare(b.start));
            const nowStr = getCurrentTimeStr();
            let nowSet = false;

            wrap.innerHTML = sorted.map(ev => {
                const isPast = ev.end ? ev.end < nowStr : ev.start < nowStr;
                let isNow = false;
                if (ev.end) {
                    isNow = ev.start <= nowStr && nowStr <= ev.end;
                } else {
                    // 終了時刻がない場合は次のイベント開始まで「現在」とする
                    const idx = sorted.indexOf(ev);
                    const next = sorted[idx + 1];
                    isNow = ev.start <= nowStr && (!next || nowStr < next.start);
                }
                if (isNow) nowSet = true;

                const typeClass = isPast ? 'is-past' : (isNow ? 'is-now' : '');

                return `
                <div class="event-card ${typeClass}">
                    <div class="event-time-col">
                        <div class="event-start">${ev.start}</div>
                        ${ev.end ? `<div class="event-end">〜${ev.end}</div>` : ''}
                    </div>
                    <div class="event-body">
                        <div class="event-name">${escHtml(ev.name)}</div>
                        <div class="event-meta">
                            ${ev.type  ? `<span class="event-badge">${escHtml(ev.type)}</span>` : ''}
                            ${ev.place ? `<span class="event-badge place">📍 ${escHtml(ev.place)}</span>` : ''}
                        </div>
                        ${ev.note ? `<div class="event-note">📝 ${escHtml(ev.note)}</div>` : ''}
                    </div>
                    ${isNow ? '<div class="now-badge"><span class="now-label">▶ 開催中</span></div>' : ''}
                </div>`;
            }).join('');
        }

        function getCurrentTimeStr() {
            const now = new Date();
            return String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }

        // ===== 管理者：イベント追加 =====
        function addEvent() {
            const start = document.getElementById('in-start').value;
            const name  = document.getElementById('in-name').value.trim();
            if (!start || !name) { alert('開始時刻とイベント名は必須です'); return; }

            events.push({
                id:    Date.now(),
                start: start,
                end:   document.getElementById('in-end').value || '',
                name:  name,
                place: document.getElementById('in-place').value.trim(),
                type:  document.getElementById('in-type').value.trim(),
                note:  document.getElementById('in-note').value.trim(),
            });
            saveEvents();

            // フォームリセット
            ['in-start','in-end','in-name','in-place','in-type','in-note'].forEach(id => {
                document.getElementById(id).value = '';
            });

            renderAdminList();
            renderTimetable();
        }

        function deleteEvent(id) {
            events = events.filter(e => e.id !== id);
            saveEvents();
            renderAdminList();
            renderTimetable();
        }

        function saveEvents() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
        }

        function renderAdminList() {
            const list = document.getElementById('admin-event-list');
            if (events.length === 0) {
                list.innerHTML = '<div style="color:#aaa; font-size:0.9rem;">まだ登録されていません</div>';
                return;
            }
            const sorted = [...events].sort((a, b) => a.start.localeCompare(b.start));
            list.innerHTML = sorted.map(ev => `
                <div class="admin-item">
                    <div class="admin-item-info">
                        <span class="admin-item-time">${ev.start}${ev.end ? ' 〜 ' + ev.end : ''}</span>
                        <strong>${escHtml(ev.name)}</strong>
                        ${ev.place ? ` ／ 📍${escHtml(ev.place)}` : ''}
                        ${ev.type  ? ` ／ 🏷️${escHtml(ev.type)}`  : ''}
                    </div>
                    <button class="btn-delete" onclick="deleteEvent(${ev.id})">削除</button>
                </div>`).join('');
        }

        // ===== データ管理 =====
        function exportData() {
            const blob = new Blob([JSON.stringify(events, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `timetable_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data)) {
                        events = data;
                        saveEvents();
                        renderAdminList();
                        renderTimetable();
                        alert('インポートしました！');
                    }
                } catch { alert('ファイルの読み込みに失敗しました'); }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function resetAll() {
            if (!confirm('全ての予定を削除しますか？')) return;
            events = [];
            saveEvents();
            renderAdminList();
            renderTimetable();
        }

        // ===== 管理者モーダル =====
        function openAdmin() {
            renderAdminList();
            document.getElementById('admin-overlay').classList.add('open');
        }
        function closeAdmin() {
            document.getElementById('admin-overlay').classList.remove('open');
        }

        document.addEventListener('keydown', e => {
            if (e.shiftKey && e.ctrlKey) { openAdmin(); return; }
            if (e.key === 'Escape') closeAdmin();
        });

        document.getElementById('admin-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeAdmin();
        });

        // ===== ユーティリティ =====
        function escHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
        }

        init();
    </script>
</body>
</html>
