<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校内マップ（縦）</title>
  <style>
    body {
      font-family: "Segoe UI", "Hiragino Maru Gothic ProN", sans-serif;
      margin: 0;
      background: transparent;
      color: #2d5a3f;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      padding: 15px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 1px 1px 0px #1a3a28;
      box-shadow: 0 6px 0px rgba(26, 58, 40, 0.3);
      border-radius: 0 0 20px 20px;
      border-bottom: 4px solid #1a3a28;
      border-left: 4px solid #1a3a28;
      border-right: 4px solid #1a3a28;
      margin-bottom: 10px;
      margin-left: 10px;
      margin-right: 10px;
      z-index: 20;
      flex-shrink: 0;
      position: relative;
    }

    /* メインエリア（地図表示） */
    .map-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      position: relative;
      overflow: hidden;
      padding: 10px;
    }

    .map-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 8px 8px 0px #1a3a28;
      transition: opacity 0.3s ease-in-out;
      border: 4px solid #1a3a28;
    }

    /* 下部の操作パネル */
    .control-panel {
      background: rgba(39, 174, 96, 0.9);
      backdrop-filter: blur(10px);
      padding: 15px 10px 25px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 -6px 0px rgba(26, 58, 40, 0.3);
      border-top: 4px solid #1a3a28;
      border-radius: 25px 25px 0 0;
      z-index: 30;
      flex-shrink: 0;
    }

    .floor-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      width: 100%;
    }

    .floor-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 4px solid #1a3a28;
      background: #1abc9c;
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 4px 4px 0px #1a3a28;
      text-shadow: 1px 1px 0px #1a3a28;
    }

    .floor-btn:hover {
      background: #2ecc71;
      transform: scale(1.1) translateY(-4px) rotate(-5deg);
      box-shadow: 6px 8px 0px #1a3a28;
    }

    .floor-btn.active {
      background: #fcf6bd;
      color: #1a3a28;
      text-shadow: none;
      border-color: #1a3a28;
      box-shadow: 0px 0px 0px #1a3a28;
      transform: scale(0.95) translate(4px, 4px);
    }
    
    /* キーボードショートカットのヒント表示（小さく数字を表示） */
    .key-hint {
      position: absolute;
      bottom: -5px;
      right: -5px;
      background: #fcf6bd;
      color: #333;
      font-size: 10px;
      font-weight: bold;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .upload-label {
      color: #94a3b8;
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 5px;
    }

    .error-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ef4444;
      font-weight: bold;
      background: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 80%;
    }

    .fade-out {
      opacity: 0;
    }

    .back-btn {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.2);
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
      border: 1px solid rgba(255,255,255,0.4);
    }
    .back-btn:hover { background: rgba(255,255,255,0.3); }

    /* --- 自動戻りカウントダウン表示 --- */
    #auto-return-msg {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(240,248,255,0.9));
        backdrop-filter: blur(10px);
        color: #2d5a3f;
        padding: 15px 25px;
        border-radius: 20px;
        border: 2px solid #bde0fe;
        font-size: 1rem;
        font-weight: 700;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        z-index: 100;
        display: none; /* 初期状態は非表示 */
        animation: fadeIn 0.5s ease;
        pointer-events: none;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    #countdown-seconds {
        font-weight: bold;
        color: #facc15; /* 黄色で強調 */
        font-size: 1.4rem;
        margin: 0 5px;
    }

  </style>
</head>
<body>

  <header>

    <span id="headerTitle">校内マップ - 1階</span>
  </header>

  <div class="map-container">
    <img id="mapImg" src="" alt="マップ" class="map-image">
    
    <div id="errorMsg" class="error-msg">
      画像が見つかりません。<br>
      下の「画像手動読み込み」を押してください。
    </div>
  </div>

  <div class="control-panel">
    <div class="floor-buttons">
      <button class="floor-btn" onclick="changeFloor(1)">1F<span class="key-hint">1</span></button>
      <button class="floor-btn" onclick="changeFloor(2)">2F<span class="key-hint">2</span></button>
      <button class="floor-btn" onclick="changeFloor(3)">3F<span class="key-hint">3</span></button>
      <button class="floor-btn" onclick="changeFloor(4)">4F<span class="key-hint">4</span></button>
    </div>

    <label class="upload-label">
      <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
    </label>
  </div>



  <script>
    // --- 設定 ---
    let maps = {
      1: "school_map(1F).png",
      2: "school_map(2F).png",
      3: "school_map(3F).png",
      4: "school_map(4F).png"
    };

    let currentFloor = 1;

    window.onload = () => {
      changeFloor(1);
    };


    // --- 既存のマップ操作処理 ---
    
    // キーボード操作イベント
    document.addEventListener('keydown', (e) => {
      // 数字キー 1,2,3,4 で階層切り替え
      if (e.key === '1') changeFloor(1);
      if (e.key === '2') changeFloor(2);
      if (e.key === '3') changeFloor(3);
      if (e.key === '4') changeFloor(4);


    });

    // 手動ファイル読み込み処理
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      files.forEach(file => {
        const url = URL.createObjectURL(file);
        if (file.name.includes("1F") || file.name.includes("1階")) maps[1] = url;
        if (file.name.includes("2F") || file.name.includes("2階")) maps[2] = url;
        if (file.name.includes("3F") || file.name.includes("3階")) maps[3] = url;
        if (file.name.includes("4F") || file.name.includes("4階")) maps[4] = url;
      });

      const imgElement = document.getElementById('mapImg');
      imgElement.src = ""; 
      setTimeout(() => changeFloor(currentFloor), 100);
      alert("画像を読み込みました！");
    });

    function changeFloor(floor) {
      const imgElement = document.getElementById('mapImg');
      const titleElement = document.getElementById('headerTitle');
      const errorMsg = document.getElementById('errorMsg');

      if (currentFloor === floor && imgElement.src && imgElement.style.display !== 'none') return;

      imgElement.classList.add('fade-out');

      setTimeout(() => {
        errorMsg.style.display = 'none';
        imgElement.style.display = 'block';
        imgElement.src = maps[floor];
        
        imgElement.onload = () => {
          imgElement.classList.remove('fade-out');
        };

        imgElement.onerror = () => {
          imgElement.style.display = 'none';
          errorMsg.style.display = 'block';
          errorMsg.innerHTML = `
            「${maps[floor]}」が見つかりません。<br>
            下のリンクから画像ファイルを選択してください。
          `;
        };
      }, 200);

      titleElement.textContent = `校内マップ - ${floor}階`;
      currentFloor = floor;

      document.querySelectorAll('.floor-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.includes(floor + 'F')) {
          btn.classList.add('active');
        }
      });
    }
  </script>
</body>
</html>
