<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>新緑祭 コラボ・メニュー一覧</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-emerald: #10b981;
            --primary-dark: #064e3b;
            --bg-gradient: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 50%, #fffbeb 100%);
            --slate-main: #64748b;
            --slate-dark: #1e293b;
            --amber-main: #f59e0b;
            --amber-deep: #b45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ===== スマホ対応 ===== */
        html {
            height: 100%;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: var(--bg-gradient);
            color: var(--slate-dark);
            min-height: 100%;
            overflow-y: auto;
        }

        /* ===== ページ全体ラッパー ===== */
        #page-root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            padding: 52px 12px 10px 12px;
            box-sizing: border-box;
        }

        /* ===== タイトルバー（ホームボタン横に小さく表示） ===== */
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 30px;
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        .title-bar h1 {
            font-size: 1rem;
            font-weight: 900;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .title-bar .subtitle {
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--primary-emerald);
            background: rgba(16, 185, 129, 0.12);
            padding: 1px 10px;
            border-radius: 20px;
            margin-left: 10px;
        }

        /* ===== 店舗グリッド ― 3列×2行で残り高さを占有 ===== */
        .shop-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            min-height: 0; /* これがないと flex child がはみ出す */
            overflow: hidden;
        }

        /* ===== 店舗カード ===== */
        .shop-card {
            background: white;
            border: 3px solid var(--slate-dark);
            border-radius: 18px;
            box-shadow: 4px 4px 0 var(--slate-dark);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
        }

        .shop-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 6px 6px 0 var(--slate-dark);
        }

        .shop-card-header {
            padding: 12px 14px 10px 14px;
            color: white;
            position: relative;
            flex-shrink: 0;
        }

        .shop-card-class {
            font-size: 0.72rem;
            font-weight: 800;
            opacity: 0.9;
        }

        .shop-card-name {
            font-size: 1.05rem;
            font-weight: 900;
            margin-top: 2px;
            line-height: 1.25;
        }

        .shop-card-loc {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.22);
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 5px;
            font-weight: 800;
        }

        .shop-card-body {
            padding: 10px 14px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fafafa;
            min-height: 0;
            overflow: hidden;
        }

        .shop-menu-preview {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .shop-menu-preview li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--slate-dark);
            border-bottom: 1px dashed rgba(0, 0, 0, 0.08);
            padding-bottom: 3px;
        }

        .shop-menu-preview li.sold-out {
            opacity: 0.45;
            text-decoration: line-through;
        }

        .preview-emoji-name {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .preview-price {
            font-weight: 900;
            color: #ea580c;
            white-space: nowrap;
        }

        .shop-card-action {
            background: var(--slate-dark);
            color: white;
            text-align: center;
            padding: 7px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.78rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .shop-card:hover .shop-card-action {
            background: var(--primary-emerald);
        }

        /* ===== 数字キーボタン（各カード下部） ===== */
        .shop-card-key-btn {
            display: none !important; /* ユーザーの要望により非表示 */
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--slate-dark);
            color: white;
            text-align: center;
            padding: 9px 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.88rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .shop-card-key-btn .key-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: white;
            color: var(--slate-dark);
            font-size: 1rem;
            font-weight: 900;
            flex-shrink: 0;
        }

        .shop-card:hover .shop-card-key-btn {
            background: var(--primary-emerald);
        }

        .shop-card:hover .shop-card-key-btn .key-circle {
            color: var(--primary-dark);
        }

        /* ===== 店舗番号バッジ ===== */
        .shop-num-badge {
            position: absolute;
            top: 10px;
            left: 12px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            color: #1e293b;
            font-size: 0.95rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.22);
            border: 2px solid rgba(255,255,255,0.7);
            z-index: 2;
        }

        /* ===== 数字キーボタンバー（非表示） ===== */
        #keypad-bar { display: none; }

        /* ===== カラーテーマ設定 ===== */
        .theme-red { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .theme-orange { background: linear-gradient(135deg, #f97316, #c2410c); }
        .theme-yellow { background: linear-gradient(135deg, #f59e0b, #b45309); }
        .theme-green { background: linear-gradient(135deg, #10b981, #047857); }
        .theme-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .theme-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .theme-pink { background: linear-gradient(135deg, #ec4899, #be185d); }
        .theme-teal { background: linear-gradient(135deg, #14b8a6, #0f766e); }

        /* ===== 模擬店メニュー詳細モーダル（オーバーレイ） ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(6, 78, 59, 0.6);
            backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 0; /* paddingを排除して画面全体に密着 */
            animation: fadeIn 0.25s ease;
        }

        .modal-overlay.open {
            display: flex;
        }

        /* モーダルカードを画面高さいっぱいに使い・スクロールなし */
        .modal-card {
            background: white;
            border: none; /* 枠線を排除してすっきり全画面 */
            box-shadow: none; /* 影を排除 */
            border-radius: 0; /* 角丸を排除して全画面密着 */
            width: 100%;
            max-width: 100%; /* 横幅100% */
            max-height: 100vh;
            max-height: 100dvh;
            height: 100vh; /* 高さ100% */
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-header {
            padding: 24px 20px 18px 20px;
            color: white;
            position: relative;
            flex-shrink: 0;
            box-sizing: border-box;
            width: 100%;
        }

        .modal-header > div {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .modal-close-btn {
            position: absolute;
            top: 20px;
            right: calc(50% - 400px + 20px); /* 800pxの中央寄せの右端にボタンをぴったり配置 */
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: none;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 10;
        }

        @media (max-width: 840px) {
            .modal-close-btn {
                right: 20px;
            }
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }

        .modal-body {
            padding: 20px 20px;
            flex: 1;
            overflow: hidden;   /* スクロールなしで全件表示 */
            display: flex;
            flex-direction: column;
            min-height: 0;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .modal-menu-list {
            list-style: none;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            overflow: hidden;
        }

        .modal-menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 2px solid var(--slate-main);
            border-radius: 14px;
            padding: 9px 14px;
            flex: 1;              /* 各アイテムが均等に高さを分け合う */
            min-height: 0;
            transition: background 0.2s;
        }

        .modal-menu-item:hover {
            background: #f1f5f9;
            transform: translateY(-2px);
        }

        .modal-menu-item.sold-out {
            border-color: #cbd5e1;
            background: #f1f5f9;
        }

        .modal-menu-item.sold-out .item-name,
        .modal-menu-item.sold-out .item-price {
            opacity: 0.4;
            text-decoration: line-through;
        }

        .modal-menu-item.sold-out .sold-label {
            display: inline-block;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .item-emoji {
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .item-name {
            font-weight: 800;
            font-size: 0.92rem;
            color: var(--slate-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sold-label {
            display: none;
            background: #ef4444;
            color: white;
            font-size: 0.72rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 8px;
            margin-left: 8px;
            box-shadow: 1px 1px 0 rgba(0,0,0,0.1);
        }

        .item-price {
            font-size: 1rem;
            font-weight: 900;
            color: #ea580c;
            flex-shrink: 0;
            white-space: nowrap;
            margin-left: 8px;
        }

        .modal-footer {
            padding: 16px 20px 20px 20px;
            text-align: center;
            background: #fafafa;
            border-top: 2px dashed rgba(0, 0, 0, 0.08);
            flex-shrink: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .modal-footer-btn {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            background: var(--slate-dark);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
            display: block;
        }

        .modal-footer-btn:hover {
            background: var(--primary-emerald);
        }

        /* ===== 管理者用モーダル（Ctrl+Shiftで起動） ===== */
        .admin-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 99999;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(8px);
        }

        .admin-overlay.open {
            display: flex;
        }

        .admin-modal {
            background: white;
            border-radius: 28px;
            border: 5px solid var(--slate-dark);
            box-shadow: 8px 8px 0 var(--slate-dark);
            width: 100%;
            max-width: 760px;
            padding: 30px;
            margin: auto;
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .admin-modal h2 {
            font-size: 1.5rem;
            color: var(--primary-emerald);
            border-bottom: 3px solid var(--primary-emerald);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .admin-tab {
            flex: 1;
            padding: 10px 5px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            background: #f1f5f9;
            color: var(--slate-main);
            border: 2px solid #cbd5e1;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .admin-tab.active {
            background: var(--primary-emerald);
            color: white;
            border-color: var(--primary-dark);
            box-shadow: 2px 2px 0 var(--primary-dark);
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--slate-dark);
            margin-bottom: 6px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 700;
            transition: all 0.2s;
            color: var(--slate-dark);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-emerald);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .btn-add {
            background: linear-gradient(135deg, var(--primary-emerald), #059669);
            color: white;
            border: 2px solid var(--primary-dark);
            box-shadow: 2px 2px 0 var(--primary-dark);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            width: 100%;
            text-align: center;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0 var(--primary-dark);
        }

        .btn-add:active {
            transform: translateY(0);
            box-shadow: 1px 1px 0 var(--primary-dark);
        }

        /* カラー選択 */
        .color-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .color-chip {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.15s;
        }

        .color-chip:hover {
            transform: scale(1.15);
        }

        .color-chip.selected {
            border-color: var(--slate-dark);
            transform: scale(1.15);
        }

        .chip-red { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .chip-orange { background: linear-gradient(135deg, #f97316, #c2410c); }
        .chip-yellow { background: linear-gradient(135deg, #f59e0b, #b45309); }
        .chip-green { background: linear-gradient(135deg, #10b981, #047857); }
        .chip-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .chip-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .chip-pink { background: linear-gradient(135deg, #ec4899, #be185d); }
        .chip-teal { background: linear-gradient(135deg, #14b8a6, #0f766e); }

        /* 管理リスト */
        .admin-store-list {
            margin-top: 15px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .admin-store-item {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .admin-store-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 8px;
        }

        .admin-store-name {
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--slate-dark);
        }

        .admin-store-class {
            font-size: 0.8rem;
            color: var(--slate-main);
            margin-left: 6px;
            font-weight: 800;
        }

        .admin-menu-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #f1f5f9;
        }
        .admin-menu-row:last-child {
            border-bottom: none;
        }

        .admin-menu-info {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--slate-dark);
        }

        .btn-sm {
            border: 2px solid var(--slate-dark);
            color: var(--slate-dark);
            background: white;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 800;
            font-family: inherit;
            transition: all 0.15s;
            margin-left: 5px;
        }

        .btn-sm:hover {
            background: #f1f5f9;
        }

        .btn-sm.delete {
            background: #fef2f2;
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-sm.delete:hover {
            background: #fee2e2;
        }

        .btn-sm.sold {
            background: #fffbeb;
            border-color: #f59e0b;
            color: #d97706;
        }

        .btn-sm.sold.active {
            background: #f59e0b;
            color: white;
            border-color: #b45309;
        }

        .btn-sm.edit {
            background: #ecfdf5;
            border-color: var(--primary-emerald);
            color: #047857;
        }

        .btn-sm.edit:hover {
            background: #d1fae5;
        }

        .btn-close {
            background: var(--slate-dark);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            font-family: inherit;
            width: 100%;
            transition: all 0.2s;
            margin-top: 15px;
        }

        .btn-close:hover {
            background: #ef4444;
        }

        .data-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn-data {
            flex: 1;
            min-width: 120px;
            text-align: center;
            border: 2px solid var(--slate-dark);
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 800;
            font-family: inherit;
            transition: all 0.15s;
        }

        .btn-data.export { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .btn-data.export:hover { background: #d1fae5; }
        .btn-data.import { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; display: inline-block; }
        .btn-data.import:hover { background: #dbeafe; }
        .btn-data.reset  { background: #fef2f2; border-color: #ef4444; color: #b91c1c; }
        .btn-data.reset:hover  { background: #fee2e2; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* ===== ドラッグ並び替え用のスタイル ===== */
        .admin-store-item {
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .admin-store-item.dragging-store {
            opacity: 0.4;
            border: 3.5px dashed #3b82f6 !important;
            background: #eff6ff !important;
            transform: scale(0.98);
        }
        .admin-menu-row {
            position: relative;
            transition: transform 0.2s ease;
        }
        .admin-menu-row.dragging-item {
            opacity: 0.4;
            border: 2px dashed #ef4444 !important;
            background: #fef2f2 !important;
            transform: scale(0.98);
        }
        .drag-handle-store:hover, .drag-handle-item:hover {
            color: var(--primary-emerald) !important;
        }

        /* 全画面モーダルヘッダー内の場所の表示を巨大化 */
        .modal-header .shop-card-loc {

        // 起動時にローカルの all_settings_config.json があれば自動でデフォルトのメニュー設定を初期化
        async function initializeMenuDefaultFromJSON() {
            const isFirstRun = localStorage.getItem(STORAGE_KEY) === null;
            if (!isFirstRun) return;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                const response = await fetch('../Ver3.0/shinryokusai_shops_setup_2026-05-26%20(2).json', { signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        shops = data;
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(shops));
                        console.log("[AutoInit] 設定ファイルからメニューのデフォルト設定を自動展開しました。");
                    } else if (data && data.menu) {
                        shops = data.menu;
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(shops));
                        console.log("[AutoInit] 共通設定ファイルからメニューのデフォルト設定を自動展開しました。");
                    }
                }
            } catch (e) {
                console.warn("[AutoInit] 共通設定ファイルからのメニュー初期化をスキップしました:", e);
            }
        }

        // ===== 初期ロード =====
        window.addEventListener('load', async () => {
            await initializeMenuDefaultFromJSON();
            loadShops();
            renderShops();

            // 他画面での更新（LocalStorage経由）を自動検知して0msでリアルタイム再描画
            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_KEY) {
                    loadShops();
                    renderShops();
                    if (document.getElementById('admin-overlay').classList.contains('open')) {
                        renderAdminList();
                    }
                }
            });
        });

        // データの読み込み
        function loadShops() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved !== null) {
                try {
                    shops = JSON.parse(saved);
                } catch (e) {
                    shops = defaultShops;
                    save();
                }
            } else {
                shops = defaultShops;
                save();
            }
        }

        // メイン画面の描画
        function renderShops() {
            const grid = document.getElementById('shop-grid');
            const countEl = document.getElementById('shop-count');
            if (countEl) countEl.innerText = shops.length;

            if (shops.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #888;">
                        <span style="font-size:3.5rem;">🏪</span>

                    </div>`;
                return;
            }

            grid.innerHTML = shops.map((shop, idx) => {
                const num = idx + 1; // 1-indexed
                
                // PC用：コンパクトプレビュー（2品）
                const previewItems = shop.items.slice(0, 2);
                const itemsHtmlPC = previewItems.map(item => `
                    <li class="${item.soldOut ? 'sold-out' : ''}">
                        <div class="preview-emoji-name">
                            <span>${item.emoji}</span>
                            <span>${item.name}</span>
                        </div>
                        <span class="preview-price">${item.price}</span>
                    </li>
                `).join('');

                const hasMore = shop.items.length > 2 ? `<li style="border:none;color:var(--primary-emerald);font-size:0.72rem;padding-top:2px;">他 ${shop.items.length - 2} 件...</li>` : '';

                // スマホ用：全メニューアコーディオン用
                const itemsHtmlSP = shop.items.length === 0
                    ? `<li style="border:none; text-align:center; color:#888; padding:15px; font-weight:800;">現在、メニュー準備中です...</li>`
                    : shop.items.map(item => `
                        <li class="${item.soldOut ? 'sold-out' : ''}" style="padding: 10px 0; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center;">
                            <div class="preview-emoji-name" style="display: flex; align-items: center; gap: 8px;">
                                <span style="font-size: 1.15rem;">${item.emoji}</span>
                                <span style="font-weight: 800; color: var(--slate-dark);">${escapeHtml(item.name)}</span>
                                ${item.soldOut ? '<span class="sold-label" style="display:inline-block; margin-left:8px;">SOLD OUT</span>' : ''}
                            </div>
                            <span class="preview-price" style="font-size: 1rem; font-weight: 900; color: #ea580c;">${item.price}</span>
                        </li>
                    `).join('');

                const numBadge = num <= 6 ? `<div class="shop-num-badge">${num}</div>` : '';

                return `
                    <div class="shop-card" id="shop-card-${shop.id}" onclick="handleShopClick(event, ${shop.id})">
                        <div class="shop-card-header theme-${shop.color || 'orange'}" style="position:relative;">

                            <div class="shop-card-class" style="${num <= 6 ? 'padding-left:36px;' : ''}">${escapeHtml(shop.className)}</div>
                            <div class="shop-card-name" style="${num <= 6 ? 'padding-left:36px;' : ''}">${escapeHtml(shop.name)}</div>
                            ${shop.location ? `<div class="shop-card-loc" style="${num <= 6 ? 'margin-left:36px;' : ''}">📍 ${escapeHtml(shop.location)}</div>` : ''}
                            <!-- アコーディオンの開閉インジケータ（スマホ専用） -->
                            <div class="accordion-icon">▼</div>
                        </div>
                        
                        <!-- PC専用プレビュー表示 -->
                        <div class="shop-card-body pc-only">
                            <ul class="shop-menu-preview">
                                ${itemsHtmlPC}
                                ${hasMore}
                            </ul>
                            <div class="shop-card-key-btn">
                                ${num <= 6
                                    ? `<span class="key-circle">${num}</span> のキーで詳細を見る`
                                    : `🍽️ タップで詳細を見る`
                                }
                            </div>
                        </div>

                        <!-- スマホ専用アコーディオン詳細表示 -->
                        <div class="shop-card-body sp-only accordion-body">
                            <ul class="shop-menu-preview" style="display:flex; flex-direction:column; gap:8px;">
                                ${itemsHtmlSP}
                            </ul>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // スマホでのアコーディオン開閉制御とPCでのモーダル表示の切り分け
        function handleShopClick(event, shopId) {
            // スマホ環境判定 (横幅 768px 以下)
            if (window.innerWidth <= 768) {
                const card = document.getElementById(`shop-card-${shopId}`);
                if (!card) return;

                const isActive = card.classList.contains('active');

                // 他のアコーディオンをすべて閉じる (画面をスッキリ保ち、プレミアムなUXを提供)
                document.querySelectorAll('.shop-grid .shop-card').forEach(c => {
                    c.classList.remove('active');
                });

                // タップされた店舗を展開
                if (!isActive) {
                    card.classList.add('active');
                    // 展開したカードが見やすくなるように、少し遅延させてスムーズにスクロール
                    setTimeout(() => {
                        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 200);
                }
            } else {
                // PC環境の場合は、これまで通り詳細モーダルを開く
                openShopDetail(shopId);
            }
        }

        // 店舗詳細モーダル表示
        function openShopDetail(shopId) {
            const shop = shops.find(s => s.id === shopId);
            if (!shop) return;

            const modal = document.getElementById('menu-modal');
            const card = document.getElementById('modal-card');

            const menuHtml = shop.items.length === 0 
                ? '<div style="text-align:center;color:#888;padding:25px;font-weight:800;">現在、メニュー準備中です...</div>'
                : shop.items.map(item => `
                    <li class="modal-menu-item ${item.soldOut ? 'sold-out' : ''}">
                        <div class="item-info">
                            <span class="item-emoji">${item.emoji}</span>
                            <span class="item-name">${escapeHtml(item.name)}</span>
                            <span class="sold-label">SOLD OUT</span>
                        </div>
                        <span class="item-price">${item.price}</span>
                    </li>
                `).join('');

            card.innerHTML = `
                <div class="modal-header theme-${shop.color || 'orange'}">
                    <div style="font-size:0.85rem; font-weight:800; opacity:0.9;">${escapeHtml(shop.className)}</div>
                    <div style="font-size:1.5rem; font-weight:900; margin-top:2px;">${escapeHtml(shop.name)}</div>
                    ${shop.location ? `<div class="shop-card-loc" style="margin-top:6px;">📍 ${escapeHtml(shop.location)}</div>` : ''}
                </div>
                <div class="modal-body">
                    <ul class="modal-menu-list">
                        ${menuHtml}
                    </ul>
                </div>
                <div class="modal-footer">
                    <button class="modal-footer-btn" onclick="closeModalDirect()">✕ 閉じる</button>
                </div>
            `;

            modal.classList.add('open');
        }

        // モール内から直接店舗を削除するアクション
        function deleteStoreDirect(shopId) {
            closeModalDirect();
            setTimeout(() => {
                deleteStore(shopId);
            }, 150);
        }

        function closeModalDirect() {
            document.getElementById('menu-modal').classList.remove('open');
        }

        function closeModal(event) {
            if (event.target === document.getElementById('menu-modal')) {
                closeModalDirect();
            }
        }

        // ===== 管理者モード (Ctrl+Shift) の制御 =====
        function openAdmin() {
            renderAdminList();
            updateStoreSelect();
            document.getElementById('admin-overlay').classList.add('open');
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage('adminOpen', '*');
                }
            } catch (e) {}
        }

        function closeAdmin() {
            document.getElementById('admin-overlay').classList.remove('open');
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage('adminClose', '*');
                }
            } catch (e) {}
        }

        function closeAdminOutside(event) {
            if (event.target === document.getElementById('admin-overlay')) {
                closeAdmin();
            }
        }



        // ===== キーパッドバーのレンダリング =====
        function renderKeypad() {
            const bar = document.getElementById('keypad-bar');
            if (!bar) return;

            let html = '';
            for (let i = 1; i <= 6; i++) {
                const shop = shops[i - 1];
                if (shop) {
                    html += `
                        <button class="keypad-btn" onclick="openShopDetail(${shop.id})" title="${escapeHtml(shop.name)}">
                            <span class="kb-num">${i}</span>
                            <span class="kb-label">${escapeHtml(shop.name)}</span>
                        </button>`;
                } else {
                    html += `<button class="keypad-btn btn-disabled">
                        <span class="kb-num">${i}</span>
                        <span class="kb-label">-</span>
                    </button>`;
                }
            }

            html += `<button class="keypad-btn btn-back" onclick="closeModalDirect()" title="一覧表示">
                <span class="kb-num">7</span>
                <span class="kb-label">一覧へ</span>
            </button>`;

            bar.innerHTML = html;
        }

        // ===== キーパッドバー（非表示だが関数は互換性のため残す） =====
        function renderKeypad() { /* キーパッドバーは指定なし */ }

        // タブの切り替え
        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            document.querySelectorAll('.admin-tab').forEach(tab => tab.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            
            if (tabId === 'tab-store') document.getElementById('tab-btn-store').classList.add('active');
            if (tabId === 'tab-item') {
                document.getElementById('tab-btn-item').classList.add('active');
                updateStoreSelect();
            }
            if (tabId === 'tab-list') {
                document.getElementById('tab-btn-list').classList.add('active');
                renderAdminList();
            }
        }

        // 色チップ選択
        function selectColor(el) {
            document.querySelectorAll('.color-chip').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            selectedColor = el.dataset.color;
        }

        // セレクトボックス店舗候補の更新
        function updateStoreSelect() {
            const sel = document.getElementById('in-store-sel');
            sel.innerHTML = '<option value="">-- 追加する模擬店を選択してください --</option>' +
                shops.map(s => `<option value="${s.id}">${escapeHtml(s.className)} ${escapeHtml(s.name)}</option>`).join('');
        }

        // 新規店舗の追加
        function addStore() {
            const name = document.getElementById('s-name').value.trim();
            const className = document.getElementById('s-class').value.trim();
            const location = document.getElementById('s-loc').value.trim();

            if (!name) { alert('模擬店名は必須です！'); return; }

            shops.push({
                id: Date.now(),
                className: className || "一般出店",
                name: name,
                location: location,
                color: selectedColor,
                items: []
            });

            save();
            renderShops();
            document.getElementById('s-name').value = '';
            document.getElementById('s-class').value = '';
            document.getElementById('s-loc').value = '';
            alert('🎉 新しい模擬店を登録しました！');
        }

        // 店舗メニューの追加
        function addItem() {
            const storeId = Number(document.getElementById('in-store-sel').value);
            const name = document.getElementById('i-name').value.trim();
            const emoji = document.getElementById('i-emoji').value.trim();
            const price = document.getElementById('i-price').value.trim();

            if (!storeId) { alert('対象の模擬店を選択してください！'); return; }
            if (!name) { alert('メニュー品目名は必須です！'); return; }

            const shop = shops.find(s => s.id === storeId);
            if (!shop) return;

            shop.items.push({
                id: Date.now(),
                emoji: emoji || "🍽️",
                name: name,
                price: price || "無料",
                soldOut: false
            });

            save();
            renderShops();
            document.getElementById('i-name').value = '';
            document.getElementById('i-emoji').value = '';
            document.getElementById('i-price').value = '';
            alert('🎉 メニューを登録しました！');
        }

        // ===== 編集・修正ダイアログ (店名、メニュー内容を自由に変更) =====
        
        // 店舗情報の自由編集
        function editStore(shopId) {
            const shop = shops.find(s => s.id === shopId);
            if (!shop) return;

            const newClassName = prompt("新しい団体・クラス名を入力してください:", shop.className);
            if (newClassName === null) return; // キャンセル

            const newName = prompt("新しい模擬店名を入力してください:", shop.name);
            if (!newName) {
                if (newName === "") alert("模擬店名は空にできません。");
                return;
            }

            const newLocation = prompt("新しい出店場所を入力してください:", shop.location);
            if (newLocation === null) return;

            shop.className = newClassName.trim() || "一般出店";
            shop.name = newName.trim();
            shop.location = newLocation.trim();

            save();
            renderShops();
            renderAdminList();
            alert("✔️ 出店情報を変更しました！");
        }

        // メニュー品目の自由編集
        function editItem(shopId, itemId) {
            const shop = shops.find(s => s.id === shopId);
            if (!shop) return;
            const item = shop.items.find(i => i.id === itemId);
            if (!item) return;

            const newEmoji = prompt("メニューの絵文字を入力してください:", item.emoji);
            if (newEmoji === null) return;

            const newName = prompt("メニュー名を入力してください:", item.name);
            if (!newName) {
                if (newName === "") alert("メニュー名は空にできません。");
                return;
            }

            const newPrice = prompt("価格・値段を入力してください:", item.price);
            if (newPrice === null) return;

            item.emoji = newEmoji.trim() || "🍽️";
            item.name = newName.trim();
            item.price = newPrice.trim() || "無料";

            save();
            renderShops();
            renderAdminList();
            alert("✔️ メニュー内容を変更しました！");
        }

        // 完売トグル
        function toggleSoldOut(shopId, itemId) {
            const shop = shops.find(s => s.id === shopId);
            if (!shop) return;
            const item = shop.items.find(i => i.id === itemId);
            if (!item) return;

            item.soldOut = !item.soldOut;
            save();
            renderShops();
            renderAdminList();
        }

        // 出店の削除
        function deleteStore(shopId) {
            if (!confirm('この店舗と登録されているメニューをすべて削除しますか？\n(出店数が減少します)')) return;
            shops = shops.filter(s => s.id !== shopId);
            save();
            renderShops();
            renderAdminList();
        }

        // メニューの削除
        function deleteItem(shopId, itemId) {
            const shop = shops.find(s => s.id === shopId);
            if (!shop) return;

            shop.items = shop.items.filter(i => i.id !== itemId);
            save();
            renderShops();
            renderAdminList();
        }

        // ===== 自由なソート（ドラッグ＆ドロップ並び替え）機能 =====
        let draggedStoreIndex = null;
        let draggedItemStoreId = null;
        let draggedItemIndex = null;

        // --- 店舗（模擬店）の並び替えハンドラー ---
        function onStoreDragStart(event, index) {
            draggedStoreIndex = index;
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', index);
            setTimeout(() => {
                event.currentTarget.classList.add('dragging-store');
            }, 0);
        }

        function onStoreDragEnd(event) {
            event.currentTarget.classList.remove('dragging-store');
            draggedStoreIndex = null;
        }

        function onStoreDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
        }

        function onStoreDrop(event, targetIndex) {
            event.preventDefault();
            if (draggedStoreIndex === null || draggedStoreIndex === targetIndex) return;

            // shops配列を並び替える
            const movedStore = shops.splice(draggedStoreIndex, 1)[0];
            shops.splice(targetIndex, 0, movedStore);

            save();
            renderShops();
            renderAdminList();
        }

        // --- 店舗内メニュー（商品）の並び替えハンドラー ---
        function onItemDragStart(event, storeId, itemIndex) {
            event.stopPropagation(); // 店舗ドラッグが発火するのを防止
            draggedItemStoreId = storeId;
            draggedItemIndex = itemIndex;
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', itemIndex);
            setTimeout(() => {
                event.currentTarget.classList.add('dragging-item');
            }, 0);
        }

        function onItemDragEnd(event) {
            event.currentTarget.classList.remove('dragging-item');
            draggedItemStoreId = null;
            draggedItemIndex = null;
        }

        function onItemDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
        }

        function onItemDrop(event, storeId, targetItemIndex) {
            event.stopPropagation();
            event.preventDefault();
            if (draggedItemStoreId === null || draggedItemStoreId !== storeId || draggedItemIndex === targetItemIndex) return;

            const shop = shops.find(s => s.id === storeId);
            if (!shop) return;

            // items配列を並び替える
            const movedItem = shop.items.splice(draggedItemIndex, 1)[0];
            shop.items.splice(targetItemIndex, 0, movedItem);

            save();
            renderShops();
            renderAdminList();
        }

        // 管理画面一覧の出力
        function renderAdminList() {
            const list = document.getElementById('admin-store-list');
            if (shops.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:30px; font-weight:800;">登録済みの模擬店はありません</div>';
                return;
            }

            list.innerHTML = shops.map((shop, idx) => {
                const itemsHtml = shop.items.length === 0
                    ? '<div style="color:#94a3b8; font-size:0.85rem; padding: 4px 6px;">メニュー品目が登録されていません</div>'
                    : shop.items.map((item, itemIdx) => `
                        <div class="admin-menu-row" draggable="true"
                             ondragstart="onItemDragStart(event, ${shop.id}, ${itemIdx})"
                             ondragend="onItemDragEnd(event)"
                             ondragover="onItemDragOver(event)"
                             ondrop="onItemDrop(event, ${shop.id}, ${itemIdx})">
                            <span class="admin-menu-info">
                                <span class="drag-handle-item" style="cursor:grab; margin-right:6px; color:#cbd5e1; user-select:none; font-weight:bold;">::</span>
                                ${escapeHtml(item.emoji)} ${escapeHtml(item.name)} — <b style="color:#ea580c;">${escapeHtml(item.price)}</b>
                            </span>
                            <div>
                                <button class="btn-sm edit" onclick="editItem(${shop.id}, ${item.id})">編集</button>
                                <button class="btn-sm sold ${item.soldOut ? 'active' : ''}" onclick="toggleSoldOut(${shop.id}, ${item.id})">
                                    ${item.soldOut ? '完売中' : '販売中'}
                                </button>
                                <button class="btn-sm delete" onclick="deleteItem(${shop.id}, ${item.id})">削除</button>
                            </div>
                        </div>
                    `).join('');

                return `
                    <div class="admin-store-item" draggable="true"
                         ondragstart="onStoreDragStart(event, ${idx})"
                         ondragend="onStoreDragEnd(event)"
                         ondragover="onStoreDragOver(event)"
                         ondrop="onStoreDrop(event, ${idx})">
                        <div class="admin-store-header">
                            <div style="display:flex; align-items:center;">
                                <span class="drag-handle-store" style="cursor:grab; margin-right:10px; color:#94a3b8; font-size:1.2rem; user-select:none; font-weight:bold;">☰</span>
                                <div>
                                    <span class="admin-store-name">${escapeHtml(shop.name)}</span>
                                    <span class="admin-store-class">${escapeHtml(shop.className)} (${escapeHtml(shop.location || '場所未定')})</span>
                                </div>
                            </div>
                            <div>
                                <button class="btn-sm edit" onclick="editStore(${shop.id})">店名・場所変更</button>
                                <button class="btn-sm delete" onclick="deleteStore(${shop.id})">店舗削除</button>
                            </div>
                        </div>
                        <div style="padding-left:26px; border-left: 3px solid #cbd5e1; margin-left: 8px;">
                            ${itemsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ===== ローカルデータ入出力 =====
        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(shops));
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(shops, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `shinryokusai_shops_setup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data)) {
                        shops = data;
                        save();
                        renderShops();
                        renderAdminList();
                        alert('🎉 設定データを正常に読み込みました！');
                    }
                } catch {
                    alert('ファイルの読み込みに失敗しました。有効なJSONを指定してください。');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function resetAll() {
            if (!confirm('⚠️ 本当にすべての店舗とメニューを全削除しますか？\n(この操作は元に戻せません)')) return;
            shops = [];
            save();
            renderShops();
            renderAdminList();
            alert('🧹 全データを初期化しました。');
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
        }
    </script>
    <script src="app_home_btn.js"></script>
</body>
</html>
