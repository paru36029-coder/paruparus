<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>独自企画 待ち時間</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
            margin: 0;
            padding: 60px 12px 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 900;
            color: #064e3b;
            margin: 0 0 16px;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card {
            background: #fff;
            border: 3px solid #1a3a28;
            border-radius: 14px;
            box-shadow: 3px 3px 0 #1a3a28;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .title {
            font-size: 0.95rem;
            font-weight: 900;
            color: #27ae60;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .info-row {
            display: flex;
            gap: 6px;
        }

        .info-box {
            background: #e0f8e9;
            border: 1.5px solid #1a3a28;
            box-shadow: 1.5px 1.5px 0 #1a3a28;
            border-radius: 8px;
            padding: 4px 8px;
            flex: 1;
            text-align: center;
        }

        .info-label {
            font-size: 0.72rem;
            font-weight: 900;
            color: #1a3a28;
            display: block;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: 900;
            color: #1a3a28;
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 40px;
            grid-column: 1/-1;
        }

        .update-bar {
            text-align: right;
            font-size: 0.78rem;
            color: #aaa;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>⏱️ 独自企画 待ち時間</h1>
    <div class="update-bar" id="update-bar">更新中...</div>
    <div class="grid" id="grid">
        <div class="loading">🔄 読込中...</div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzgrgP84UFyJoEiBBzskZxBOV6BJQz0TbT-lEyntc_w-OpwjyEbe07sd_iP59OeUimWJQ/exec';
        const CACHE_KEY = 'naviWaitTimeCache';

        const ALL_PROJECTS = [
            { key: "炎の岡卓治郎TV〜Kりたいもんですよ〜", title: "炎の岡卓治郎TV〜Kりたいもんですよ〜", waitTime: "準備中", callNumber: "" },
            { key: "南の島のアニマルクルーズ", title: "南の島のアニマルクルーズ", waitTime: "準備中", callNumber: "" },
            { key: "アヒルマニアReturns~1st ANNIVERSARY~", title: "アヒルマニアReturns~1st ANNIVERSARY~", waitTime: "準備中", callNumber: "" },
            { key: "TOY STORY MA2A", title: "TOY STORY MA2A", waitTime: "準備中", callNumber: "" },
            { key: "BRIBRIバイキング", title: "BRIBRIバイキング", waitTime: "準備中", callNumber: "" },
            { key: "迷宮入りの夢世界(ワンダーランド)", title: "迷宮入りの夢世界(ワンダーランド)", waitTime: "準備中", callNumber: "" },
            { key: "健太郎電鉄〜最強社長は誰だ〜", title: "健太郎電鉄〜最強社長は誰だ〜", waitTime: "準備中", callNumber: "" },
            { key: "わっしょい理数科", title: "わっしょい理数科", waitTime: "準備中", callNumber: "" },
            { key: "運命の確率(プロバリティー)", title: "運命の確率(プロバリティー)", waitTime: "準備中", callNumber: "" },
            { key: "漆黒の迷宮(ブラックラビリンス)", title: "漆黒の迷宮(ブラックラビリンス)", waitTime: "準備中", callNumber: "" },
            { key: "愛をgrowing up 〜君と過ごすコーヒーカップ〜", title: "愛をgrowing up 〜君と過ごすコーヒーカップ〜", waitTime: "準備中", callNumber: "" },
            { key: "恐怖の松林(パインフォレスト)", title: "恐怖の松林(パインフォレスト)", waitTime: "準備中", callNumber: "" },
            { key: "Toy stone!!!", title: "Toy stone!!!", waitTime: "準備中", callNumber: "" },
            { key: "9番出口", title: "9番出口", waitTime: "準備中", callNumber: "" }
        ];

        function renderCards(data) {
            const map = {};
            ALL_PROJECTS.forEach(p => { map[p.key] = { ...p }; });

            (data || []).forEach(item => {
                if (!item) return;
                const cls = String(item.className || '').trim();
                const ttl = String(item.title || '').trim();
                if (ttl.includes('遅延情報') || cls.includes('遅延情報')) return;
                const found = ALL_PROJECTS.find(p =>
                    cls === p.key || ttl === p.key ||
                    cls.includes(p.key) || p.key.includes(cls) ||
                    ttl.includes(p.key) || p.key.includes(ttl)
                );
                if (found) {
                    const proj = map[found.key];
                    let status = '';
                    if (ttl && ttl !== '準備中' && !ttl.includes(found.key)) {
                        status = ttl;
                    } else if (item.waitTime) {
                        status = String(item.waitTime).trim();
                    }
                    proj.waitTime = status;
                }
            });

            const html = ALL_PROJECTS.map(p => {
                const proj = map[p.key];
                let displayValue = proj.waitTime || '準備中';
                const num = Number(displayValue);
                if (!isNaN(num) && displayValue !== '') {
                    displayValue = num === 0 ? 'すぐ入れます' : num + ' 分';
                }

                return `<div class="card">
                    <div class="title">${proj.title}</div>
                    <div class="info-row">
                        <div class="info-box">
                            <span class="info-label">⏱️ 待ち時間</span>
                            <span class="info-value">${displayValue}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('grid').innerHTML = html;
        }

        async function loadData() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) renderCards(JSON.parse(cached));
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error();
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                    renderCards(data);
                }
            } catch (e) {
                if (!document.getElementById('grid').children.length) {
                    document.getElementById('grid').innerHTML = '<div class="loading">⚠️ データ取得失敗。しばらくお待ちください。</div>';
                }
            }
        }

        let sec = 15;
        setInterval(() => {
            sec--;
            if (sec <= 0) { sec = 15; loadData(); }
            document.getElementById('update-bar').textContent = `次回更新まで: ${sec}秒`;
        }, 1000);

        loadData();
    </script>
<script src="app_home_btn.js"></script>
</body>
</html>
